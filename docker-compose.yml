services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tasca
      POSTGRES_PASSWORD: tasca
      POSTGRES_DB: tasca
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasca -d tasca"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://tasca:tasca@postgres:5432/tasca
      SYNC_DATABASE_URL: postgresql+psycopg://tasca:tasca@postgres:5432/tasca
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
